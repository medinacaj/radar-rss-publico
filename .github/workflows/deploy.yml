name: Actualizar noticias y publicar

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - "sources/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      restore_run_id:
        description: "ID de una ejecución anterior con copia radar-public-data; solo para recuperación manual"
        required: false
        type: string
  schedule:
    # Cada 3 horas (UTC); GitHub puede retrasar ejecuciones programadas.
    - cron: "17 */3 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Recuperar noticias anteriores
        uses: actions/cache@v4
        with:
          path: |
            web/data/articles.json
            web/data/status.json
          key: radar-history-v1-${{ github.run_id }}
          restore-keys: |
            radar-history-v1-
      - name: Restaurar copia de seguridad seleccionada (solo ejecución manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN: ${{ inputs.restore_run_id }}
        run: |
          if ! [[ "$RESTORE_RUN" =~ ^[0-9]{8,15}$ ]]; then
            echo "ID de ejecución de respaldo inválido" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/radar-restore"
          gh run download "$RESTORE_RUN" --repo "$GITHUB_REPOSITORY" --name "radar-public-data-$RESTORE_RUN" --dir "$RUNNER_TEMP/radar-restore"
          python scripts/validate_restore.py "$RUNNER_TEMP/radar-restore"
          cp "$RUNNER_TEMP/radar-restore/articles.json" web/data/articles.json
          cp "$RUNNER_TEMP/radar-restore/status.json" web/data/status.json
      - name: Recuperar historial anterior de Pages
        if: ${{ inputs.restore_run_id == '' }}
        run: python scripts/recover_history.py web/data
      - name: Auditar integridad del catálogo RSS
        run: python scripts/audit_feeds.py --opml sources/feeds.opml
      - name: Revisar estructura de fuentes
        run: python -m unittest discover -s tests -v
      - name: Validar JavaScript de la interfaz
        run: |
          node --check web/app.js
          node --check web/library.js
          node --check web/sidebar-layout.js
          node --check web/news-effects.js
          node --check web/features.js
          node --check web/v12.js
          node --check web/v13.js
          node --check web/sw.js
          node tests/test_sidebar_behavior.cjs
          node tests/test_news_effects.cjs
      - name: Obtener noticias
        run: python scripts/collect.py --opml sources/feeds.opml --out web/data --days 90 --workers 8 --max-per-feed 40 --image-fallback
      - name: Validar JSON antes de publicar
        run: python scripts/validate_data.py web/data
      - name: Preparar auditoría editorial orientativa
        run: |
          python scripts/audit_editorial.py web/data --report editorial-audit.md
          cat editorial-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Resguardar JSON públicos (copia de recuperación de 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: radar-public-data-${{ github.run_id }}
          path: |
            web/data/articles.json
            web/data/sources.json
            web/data/status.json
            web/data/meta.json
          retention-days: 90
          if-no-files-found: error
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar verificador del repositorio
        uses: actions/checkout@v4
      - name: Preparar Python para verificación
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar publicación de noticias y estado RSS
        env:
          RADAR_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_pages.py "$RADAR_PAGE_URL" --attempts 8 --delay 15